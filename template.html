<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2f5d50">
<title>Koulu</title>
<style>
:root{
  --bg:#f6f5f1; --card:#ffffff; --text:#1d2321; --muted:#66706c; --line:#e3e1da;
  --accent:#2f5d50; --accent-soft:#e3eee9; --warn:#b3541e; --warn-soft:#fbeadf;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121614; --card:#1b201e; --text:#e8ebe9; --muted:#9aa39f; --line:#2b322f;
    --accent:#8cc5b0; --accent-soft:#1f2e29; --warn:#f0a070; --warn-soft:#35241a;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 48px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
h1{font-size:22px;margin:0}
.status{border-radius:12px;padding:12px 14px;margin:0 0 16px;background:var(--accent-soft);border:1px solid var(--accent)}
.status-main{font-size:20px;font-weight:700;color:var(--accent)}
.status-sub{font-size:14px;color:var(--muted);margin-top:2px}
.status.old{background:var(--warn-soft);border-color:var(--warn)}
.status.old .status-main{color:var(--warn)}
.tabs{display:flex;gap:8px;margin:0 0 20px;overflow-x:auto}
.tabs button{flex:1;min-width:0;padding:10px 12px;border-radius:999px;border:1px solid var(--line);
  background:var(--card);color:var(--text);font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected=true]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin:0 0 16px}
.seg button{flex:1;padding:10px 8px;border:0;border-radius:9px;background:transparent;color:var(--muted);font:inherit;font-weight:700;cursor:pointer}
.seg button[aria-selected=true]{background:var(--accent-soft);color:var(--accent)}
h2{font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:24px 0 8px}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.item.soon{border-color:var(--warn);background:var(--warn-soft)}
.row{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.subj{font-weight:700}
.when{font-size:14px;color:var(--muted);white-space:nowrap}
.soon .when{color:var(--warn);font-weight:700}
.title{margin-top:2px}
.topic{margin-top:6px;color:var(--muted);white-space:pre-line;font-size:15px}
.day{font-weight:700;margin:16px 0 6px;font-size:15px}
.day:first-of-type{margin-top:0}
.hw{white-space:pre-line;margin-top:2px}
.empty{color:var(--muted);padding:8px 0}
footer{margin-top:32px;font-size:13px;color:var(--muted)}
.share{margin-top:16px;display:flex;flex-wrap:wrap;gap:8px}
.share button{font:inherit;font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Koulu</h1></header>
  <div class="status" id="status"><div class="status-main" id="updated"></div><div class="status-sub" id="updated-sub"></div></div>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <nav class="seg" id="seg" role="tablist">
    <button role="tab" data-v="kokeet" id="seg-kokeet">Kokeet</button>
    <button role="tab" data-v="laksyt" id="seg-laksyt">Läksyt</button>
  </nav>
  <main id="main"></main>
  <footer>Tiedot haetaan Wilmasta automaattisesti tunnin välein klo 6–22. Jos jotain puuttuu, tarkista Wilmasta.
    <div class="share" id="share"></div></footer>
</div>
<script>
const DATA = __DATA__;
const WD = ["su","ma","ti","ke","to","pe","la"];
const WDL = ["sunnuntai","maanantai","tiistai","keskiviikko","torstai","perjantai","lauantai"];

function localToday(){ const n=new Date(); return new Date(n.getFullYear(),n.getMonth(),n.getDate()); }
function parse(iso){ const [y,m,d]=iso.split("-").map(Number); return new Date(y,m-1,d); }
function diffDays(iso){ return Math.round((parse(iso)-localToday())/86400000); }
function short(iso){ const d=parse(iso); return `${WD[d.getDay()]} ${d.getDate()}.${d.getMonth()+1}.`; }
function esc(s){ return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function examWhen(iso){
  const n=diffDays(iso);
  if(n===0) return "tänään";
  if(n===1) return "huomenna";
  if(n<7) return `${WDL[parse(iso).getDay()]} (${n} pv)`;
  return `${short(iso)} (${n} pv)`;
}
function hwDay(iso){
  const n=diffDays(iso);
  if(n===0) return "Tänään annetut";
  if(n===-1) return "Eilen annetut";
  if(n>0) return `${short(iso)} (tuleva)`;
  const d=parse(iso); return `${WDL[d.getDay()][0].toUpperCase()+WDL[d.getDay()].slice(1)} ${d.getDate()}.${d.getMonth()+1}.`;
}

let VIEW="kokeet", KID=0;
function render(i){
  if(i!==undefined) KID=i;
  const k=DATA.kids[KID];
  const exams=k.exams.filter(e=>diffDays(e.date)>=0);
  document.getElementById("seg-kokeet").textContent=`Kokeet (${exams.length})`;
  document.getElementById("seg-laksyt").textContent=`Läksyt (${k.homework.length})`;
  let h="";
  if(VIEW==="kokeet"){
    if(!exams.length) h+=`<div class="empty">Ei tulevia kokeita.</div>`;
    for(const e of exams){
      const soon=diffDays(e.date)<=3;
      h+=`<div class="item${soon?" soon":""}"><div class="row"><span class="subj">${esc(e.subject)}</span><span class="when">${examWhen(e.date)}</span></div>`
        +(e.title&&e.title!==e.subject?`<div class="title">${esc(e.title)}</div>`:"")
        +(e.topic?`<div class="topic">${esc(e.topic)}</div>`:"")+`</div>`;
    }
  } else {
    h+=`<h2>3 viimeistä koulupäivää</h2>`;
    if(!k.homework.length) h+=`<div class="empty">Ei merkittyjä läksyjä.</div>`;
    let cur=null;
    for(const x of k.homework){
      if(x.date!==cur){ cur=x.date; h+=`<div class="day">${hwDay(x.date)}</div>`; }
      h+=`<div class="item"><div class="subj">${esc(x.subject)}</div><div class="hw">${esc(x.text)}</div></div>`;
    }
  }
  document.getElementById("main").innerHTML=h;
  document.querySelectorAll("#tabs button").forEach((b,j)=>b.setAttribute("aria-selected",j===KID));
  document.querySelectorAll("#seg button").forEach(b=>b.setAttribute("aria-selected",b.dataset.v===VIEW));
  try{ localStorage.setItem("koulu-lapsi",String(KID)); localStorage.setItem("koulu-nakyma",VIEW); }catch(e){}
}

// Suorat linkit ilman salasanaa: linkki sisältää salasanan tiivisteen (staticrypt)
function shareButtons(names){
  let hash=null; try{ hash=localStorage.getItem("staticrypt_passphrase"); }catch(e){}
  if(!hash){ const m=location.hash.match(/staticrypt_pwd=([^&]*)/); if(m) hash=m[1]; }
  if(!hash) return;
  const box=document.getElementById("share"), base=location.origin+location.pathname;
  names.forEach(n=>{
    const b=document.createElement("button");
    b.textContent=`Jaa suora linkki: ${n}`;
    b.onclick=async()=>{
      const url=`${base}?lapsi=${encodeURIComponent(n.toLowerCase())}#staticrypt_pwd=${hash}&remember_me`;
      try{ if(navigator.share){ await navigator.share({title:"Koulu",url}); return; } }catch(e){ return; }
      try{ await navigator.clipboard.writeText(url); b.textContent="Linkki kopioitu ✓"; }catch(e){ prompt("Kopioi linkki:",url); }
    };
    box.appendChild(b);
  });
}

(function init(){
  const tabs=document.getElementById("tabs");
  if(DATA.kids.length<2) tabs.style.display="none";
  // Näytetään se nimen osa, joka erottaa lapset (Wilma voi antaa "Sukunimi Etunimi")
  const words=DATA.kids.map(k=>k.name.trim().split(/\s+/));
  let wi=0; while(words.length>1 && wi<5 && new Set(words.map(w=>w[wi])).size<words.length) wi++;
  DATA.kids.forEach((k,i)=>{
    const b=document.createElement("button"); b.role="tab"; b.textContent=words[i][wi]||k.name;
    b.onclick=()=>render(i); tabs.appendChild(b);
  });
  // Iso päivitysleima: vihreä = tuore, oranssi = yli 3 h vanha
  const u=new Date(DATA.updated), hh=String(u.getHours()).padStart(2,"0"), mm=String(u.getMinutes()).padStart(2,"0");
  const dd=Math.round((localToday()-new Date(u.getFullYear(),u.getMonth(),u.getDate()))/86400000);
  const day=dd===0?"tänään":dd===1?"eilen":`${WDL[u.getDay()]} ${u.getDate()}.${u.getMonth()+1}.`;
  document.getElementById("updated").textContent=`Päivitetty ${day} klo ${hh}.${mm}`;
  const ageH=(Date.now()-u.getTime())/3600000;
  const ago=ageH<1?`${Math.max(1,Math.round(ageH*60))} min sitten`:ageH<48?`${Math.round(ageH)} h sitten`:`${Math.round(ageH/24)} pv sitten`;
  document.getElementById("updated-sub").textContent=ageH>3?`${ago} – uusimmat merkinnät voivat puuttua, tarkista tarvittaessa Wilmasta`:ago;
  if(ageH>3) document.getElementById("status").classList.add("old");
  document.querySelectorAll("#seg button").forEach(b=>b.onclick=()=>{ VIEW=b.dataset.v; render(); window.scrollTo(0,0); });
  let s=0; try{ s=Number(localStorage.getItem("koulu-lapsi"))||0; VIEW=localStorage.getItem("koulu-nakyma")==="laksyt"?"laksyt":"kokeet"; }catch(e){}
  // ?lapsi=venla (nimen osa) tai ?lapsi=0
  const q=(new URLSearchParams(location.search).get("lapsi")||"").toLowerCase();
  if(q){ const j=DATA.kids.findIndex(k=>k.name.toLowerCase().split(/\s+/).includes(q)); s=j>=0?j:(Number(q)||0); }
  render(Math.min(s,DATA.kids.length-1));
  // staticrypt tallentaa tiivisteen vasta purun jälkeen, joten odotetaan hetki
  setTimeout(()=>shareButtons(words.map(w=>w[wi])),600);
})();
</script>
</body>
</html>
